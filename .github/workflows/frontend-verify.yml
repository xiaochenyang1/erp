name: Frontend Verify

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: frontend-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-frontend-changes:
    name: Detect Frontend Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Detect frontend changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base_sha="$BEFORE_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          fi
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]] || ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            changed_files="$(git ls-files)"
          else
            changed_files="$(git diff --name-only "$base_sha" "$TARGET_SHA")"
          fi

          frontend_changed=false
          while IFS= read -r changed_file; do
            case "$changed_file" in
              frontend/*|.github/workflows/frontend-verify.yml)
                frontend_changed=true
                break
                ;;
            esac
          done <<< "$changed_files"
          echo "frontend=$frontend_changed" >> "$GITHUB_OUTPUT"
          echo "Frontend changes detected: $frontend_changed"

  frontend-verify:
    name: Type Check, Lint, Test, Build, Audit
    needs: detect-frontend-changes
    if: needs.detect-frontend-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --audit=false

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Contract checks
        run: npm run check:contracts

      - name: Release artifact regression tests
        run: npm run test:release

      - name: Build release artifact
        run: npm run release:build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

      - name: Verify frontend release artifact
        id: verify-artifact
        env:
          CANDIDATE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          npm run release:verify -- --artifact release-artifacts --expected-revision "$CANDIDATE_REVISION"
          echo "manifest-sha256=$(sha256sum release-artifacts/manifest.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Upload frontend release artifact
        id: upload-artifact
        uses: actions/upload-artifact@v7
        with:
          name: erp-frontend-release-artifacts
          if-no-files-found: error
          retention-days: 90
          path: frontend/release-artifacts/

      - name: Download uploaded frontend release artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.upload-artifact.outputs.artifact-id }}
          path: ${{ runner.temp }}/frontend-release-roundtrip
          merge-multiple: true

      - name: Verify downloaded frontend release artifact
        env:
          CANDIDATE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/frontend-release-roundtrip
          MANIFEST_SHA256: ${{ steps.verify-artifact.outputs.manifest-sha256 }}
        run: |
          npm run release:verify -- --artifact "$ARTIFACT_DIRECTORY" \
            --expected-revision "$CANDIDATE_REVISION" --expected-manifest-sha256 "$MANIFEST_SHA256"
