spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/erp?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
    username: ${ERP_DATASOURCE_USERNAME}
    password: ${ERP_DATASOURCE_PASSWORD}
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: ${ERP_DEV_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${ERP_DEV_SWAGGER_UI_ENABLED:false}

erp:
  error:
    expose-unexpected-message: ${ERP_EXPOSE_UNEXPECTED_MESSAGE:false}
  attachment:
    storage-root: ${ERP_ATTACHMENT_STORAGE_ROOT:./data/attachments}
    max-file-size-bytes: 20971520
  idempotency:
    enabled: true
    ttl-seconds: 86400
    max-replay-body-bytes: 1048576
    max-request-body-bytes: 1048576
  import:
    max-file-size-bytes: 5242880
    max-rows: 5000
    max-cell-length: 4096
    commit-batch-size: 500
  report:
    max-export-rows: 5000
    export-batch-size: 500
  security:
    public-api-docs-enabled: ${ERP_PUBLIC_API_DOCS_ENABLED:false}
    jwt:
      secret: ${ERP_JWT_SECRET}
      access-token-ttl-seconds: 7200
      refresh-token-ttl-seconds: 1209600
