name: PR Verify

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  maven-test:
    name: Release Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run release check
        shell: pwsh
        run: ./scripts/release-check.ps1 -IncludeTestcontainers

      - name: Verify release check report
        shell: pwsh
        run: ./scripts/verify-release-check-report.ps1 -ReportDirectory target

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erp-server-release-artifacts
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/erp-server-1.0.0.jar
            target/classes/META-INF/sbom/application.cdx.json
            target/bom.json
            target/release-check-report.json
            target/release-check-report.md
            target/surefire-reports/**
