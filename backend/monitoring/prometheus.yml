global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/erp-alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: erp-server
    metrics_path: /actuator/prometheus
    scheme: https
    static_configs:
      - targets: ["erp-server:8443"]
        labels:
          service: erp-server
    basic_auth:
      username: "${ERP_METRICS_USERNAME}"
      password_file: /etc/prometheus/secrets/erp-metrics-password
