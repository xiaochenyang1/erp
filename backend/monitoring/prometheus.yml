global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: erp-server
    metrics_path: /actuator/prometheus
    # The application and docker-compose expose plain HTTP on port 8080.
    # Put TLS in a deployment overlay and change both fields together when
    # Prometheus reaches the service through an HTTPS reverse proxy.
    scheme: http
    static_configs:
      - targets: ["erp-server:8080"]
        labels:
          service: erp-server
    # ERP disables HTTP Basic and authenticates protected endpoints with JWT.
    # Mount a short-lived service-account JWT here; rotate it and reload
    # Prometheus before the token expires.
    bearer_token_file: /etc/prometheus/secrets/erp-metrics-token
