# Prometheus rules for metrics emitted by Spring Boot/Micrometer and the ERP
# business-health binder. Keep this file in sync with the application metric
# names; a rule referencing an unregistered metric silently never fires.

groups:
  - name: erp-availability
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up{job="erp-server"} == 0
        for: 1m
        labels:
          severity: critical
          component: application
        annotations:
          summary: ERP service is unavailable
          description: Prometheus cannot scrape the ERP service for more than one minute.

      - alert: HighCPUUsage
        expr: system_cpu_usage{job="erp-server"} > 0.80
        for: 5m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: ERP CPU usage is high
          description: System CPU usage has remained above 80 percent for five minutes.

      - alert: CriticalCPUUsage
        expr: system_cpu_usage{job="erp-server"} > 0.95
        for: 2m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: ERP CPU usage is critical
          description: System CPU usage has remained above 95 percent for two minutes.

      - alert: HighMemoryUsage
        expr: >-
          sum by (instance) (jvm_memory_used_bytes{job="erp-server",area="heap"})
          /
          clamp_min(sum by (instance) (jvm_memory_max_bytes{job="erp-server",area="heap"}), 1)
          > 0.85
        for: 5m
        labels:
          severity: warning
          component: jvm
        annotations:
          summary: ERP JVM heap usage is high
          description: JVM heap usage has remained above 85 percent for five minutes.

      - alert: DiskSpaceLow
        expr: >-
          sum by (instance,path) (disk_free_bytes{job="erp-server"})
          /
          clamp_min(sum by (instance,path) (disk_total_bytes{job="erp-server"}), 1)
          < 0.10
        for: 10m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: ERP disk space is low
          description: Less than ten percent of the monitored filesystem is available.

  - name: erp-application
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: >-
          sum by (instance) (rate(http_server_requests_seconds_count{job="erp-server",status=~"5.."}[5m]))
          /
          clamp_min(sum by (instance) (rate(http_server_requests_seconds_count{job="erp-server"}[5m])), 0.001)
          > 0.05
        for: 3m
        labels:
          severity: warning
          component: application
        annotations:
          summary: ERP HTTP 5xx rate is high
          description: More than five percent of ERP HTTP requests returned a 5xx status for three minutes.

      - alert: DatabaseConnectionPoolHigh
        expr: >-
          hikaricp_connections_active{job="erp-server"}
          /
          clamp_min(hikaricp_connections_max{job="erp-server"}, 1)
          > 0.80
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: ERP database connection pool is saturated
          description: An ERP HikariCP pool has used more than 80 percent of its configured connections.

  - name: erp-business-health
    interval: 30s
    rules:
      - alert: ErpReadinessP0P1Unpassed
        expr: erp_business_health_check_count{check="READINESS_UNPASSED_P0_P1"} > 0
        for: 5m
        labels:
          severity: critical
          component: release
        annotations:
          summary: ERP readiness P0/P1 checks are not fully passed
          description: One or more P0/P1 readiness items are pending, failed, blocked, or skipped.

      - alert: ErpRecentImportFailures
        expr: erp_business_health_check_count{check="IMPORT_FAILED_RECENT"} > 0
        for: 10m
        labels:
          severity: warning
          component: import
        annotations:
          summary: ERP import jobs failed in the last 24 hours
          description: Recent failed import jobs need operator review.

      - alert: ErpNegativeInventoryBalance
        expr: erp_business_health_check_count{check="NEGATIVE_INVENTORY_BALANCE"} > 0
        for: 10m
        labels:
          severity: warning
          component: inventory
        annotations:
          summary: ERP negative inventory balances exist
          description: The business-health summary detected negative stock balances.

      - alert: ErpNoOpenAccountingPeriod
        expr: erp_business_health_check_count{check="OPEN_PERIOD_COUNT"} == 0
        for: 5m
        labels:
          severity: critical
          component: finance
        annotations:
          summary: ERP has no open accounting period
          description: The current account book has no OPEN accounting period.

      - alert: ErpBusinessHealthWarn
        expr: erp_business_health_overall_status > 0
        for: 5m
        labels:
          severity: warning
          component: business
        annotations:
          summary: ERP business health is WARN
          description: At least one ERP business-health check reports WARN.
