worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 21m;
        add_header X-Content-Type-Options nosniff always;

        # Resolve the backend again after container recreation, without restarting Nginx.
        set $erp_backend http://erp-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        location = /readyz {
            proxy_pass $erp_backend/actuator/health/readiness;
            add_header Cache-Control "no-store" always;
        }
        location = /api { return 404; }
        location ^~ /api/ {
            proxy_pass $erp_backend;
            add_header Cache-Control "no-store" always;
        }
        # Metrics are available to internal monitoring via erp-server, not the public web entry.
        location = /actuator { return 404; }
        location ^~ /actuator/ { return 404; }
        location ~ /\. { return 404; }
        location = /__deployment.json {
            add_header Cache-Control "no-store" always;
        }
        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
        }
        location = /index.html {
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
